name = "reelm-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Create the database with `npx wrangler d1 create reelm`, then paste its id below.
[[d1_databases]]
binding = "DB"
database_name = "reelm"
database_id = "fb0c3004-3e73-4c88-b3cf-db83b951e0e0"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "USER_HUB"
class_name = "UserHub"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed classes are required on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserHub", "Room"]

[vars]
# JSON string served at /.well-known/assetlinks.json (Android App Links). Empty array if unset.
ASSET_LINKS = ""
# Cloudflare account for the admin Ops page (not a secret). Pair with `wrangler secret put CF_ANALYTICS_TOKEN`.
CF_ACCOUNT_ID = "9a6eaa08a8e3639bdda2ac99eb374ab5"
